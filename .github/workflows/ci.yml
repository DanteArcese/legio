name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run pytest

  # Docs-only changes skip the Godot jobs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      godot: ${{ steps.filter.outputs.godot }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if git diff --name-only "$base" HEAD 2>/dev/null | grep -qvE '^docs/|\.md$'; then
            echo godot=true >> "$GITHUB_OUTPUT"
          elif git cat-file -e "$base" 2>/dev/null; then
            echo godot=false >> "$GITHUB_OUTPUT"
          else
            echo godot=true >> "$GITHUB_OUTPUT"
          fi

  godot:
    needs: changes
    if: needs.changes.outputs.godot == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Unit tests, then playtests split into four shards balanced by
        # scripts/playtest-times.tsv.
        shard: [unit, 1/4, 2/4, 3/4, 4/4]
    name: godot (${{ matrix.shard }})
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v7
      - name: Install Godot
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - if: matrix.shard == 'unit'
        run: scripts/godot-tests.sh
      - name: Playtest scenarios (headless)
        if: matrix.shard != 'unit'
        run: scripts/playtest-all.sh --shard ${{ matrix.shard }}
