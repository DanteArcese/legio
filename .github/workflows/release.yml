name: Release

# Pushing a tag like v0.1.0 builds Legio.exe and attaches it to a GitHub
# release. Running the workflow by hand builds it as a downloadable artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v7
      - name: Install Godot
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-windows-${{ env.GODOT_VERSION }}
      - run: scripts/export-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Legio-windows
          path: build/windows/Legio.exe
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/windows/Legio.exe --title "Legio ${{ github.ref_name }}" --generate-notes
